    <!-- 320°--> <line x1="960" y1="240" x2="960" y2="252" transform="rotate(320 960 300)"/>
    <!-- 325°--> <line x1="960" y1="240" x2="960" y2="252" transform="rotate(325 960 300)"/>
    <!-- 335°--> <line x1="960" y1="240" x2="960" y2="252" transform="rotate(335 960 300)"/>
    <!-- 340°--> <line x1="960" y1="240" x2="960" y2="252" transform="rotate(340 960 300)"/>
