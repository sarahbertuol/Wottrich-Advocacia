  <!-- r=210 -->
  <circle cx="960" cy="300" r="210" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.6"/>
  <!-- r=170 -->
  <circle cx="960" cy="300" r="170" fill="none" stroke="#C9973A" stroke-width="1.2" stroke-opacity="0.65"/>
  <!-- r=130 -->
  <circle cx="960" cy="300" r="130" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.7"/>
  <!-- r=90 -->
  <circle cx="960" cy="300" r="90" fill="none" stroke="#F2D878" stroke-width="1.5" stroke-opacity="0.75"/>
  <!-- r=55 -->
  <circle cx="960" cy="300" r="55" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.7"/>
  <!-- r=25 -->
  <circle cx="960" cy="300" r="25" fill="none" stroke="#F2D878" stroke-width="1.5" stroke-opacity="0.85"/>

