<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F2D878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A6012;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradH1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F2D878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A6012;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Navy background -->
  <rect width="1200" height="600" fill="#111D34"/>

  <!-- === COLUMN 1 at x≈800 === -->
  <!-- Column shaft -->
  <rect x="775" y="155" width="50" height="305" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-opacity="0.9"/>
  <!-- Fluting lines inside shaft -->
  <line x1="785" y1="155" x2="785" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.6"/>
  <line x1="793" y1="155" x2="793" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.6"/>
  <line x1="801" y1="155" x2="801" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.6"/>
  <line x1="809" y1="155" x2="809" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.6"/>
  <line x1="817" y1="155" x2="817" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.6"/>
  <!-- Ionic capital - echinus (curved base of capital) -->
  <path d="M768,155 Q800,145 832,155" fill="none" stroke="url(#goldGrad1)" stroke-width="1.8" stroke-opacity="0.95"/>
  <path d="M770,148 Q800,138 830,148" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.7"/>
  <!-- Volutes (scrolls) -->
  <path d="M771,151 Q763,144 768,136 Q773,128 781,132 Q789,136 785,143" fill="none" stroke="#C9973A" stroke-width="1.2" stroke-opacity="0.85"/>
  <path d="M829,151 Q837,144 832,136 Q827,128 819,132 Q811,136 815,143" fill="none" stroke="#C9973A" stroke-width="1.2" stroke-opacity="0.85"/>
  <!-- Abacus (flat top of capital) -->
  <rect x="763" y="130" width="74" height="10" fill="none" stroke="url(#goldGrad1)" stroke-width="1.8" stroke-opacity="0.95"/>
  <!-- Column base -->
  <rect x="768" y="455" width="64" height="8" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-opacity="0.9"/>
  <rect x="763" y="463" width="74" height="6" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-opacity="0.9"/>

  <!-- === COLUMN 2 at x≈980 === -->
  <rect x="955" y="155" width="50" height="305" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-opacity="0.95"/>
  <!-- Fluting lines -->
  <line x1="965" y1="155" x2="965" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.65"/>
  <line x1="973" y1="155" x2="973" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.65"/>
  <line x1="981" y1="155" x2="981" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.65"/>
  <line x1="989" y1="155" x2="989" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.65"/>
  <line x1="997" y1="155" x2="997" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.65"/>
  <!-- Ionic capital -->
  <path d="M948,155 Q980,145 1012,155" fill="none" stroke="url(#goldGrad1)" stroke-width="1.8" stroke-opacity="1"/>
  <path d="M950,148 Q980,138 1010,148" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.75"/>
  <!-- Volutes -->
  <path d="M951,151 Q943,144 948,136 Q953,128 961,132 Q969,136 965,143" fill="none" stroke="#C9973A" stroke-width="1.2" stroke-opacity="0.9"/>
  <path d="M1009,151 Q1017,144 1012,136 Q1007,128 999,132 Q991,136 995,143" fill="none" stroke="#C9973A" stroke-width="1.2" stroke-opacity="0.9"/>
  <!-- Abacus -->
  <rect x="943" y="130" width="74" height="10" fill="none" stroke="url(#goldGrad1)" stroke-width="1.8" stroke-opacity="1"/>
  <!-- Column base -->
  <rect x="948" y="455" width="64" height="8" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-opacity="0.95"/>
  <rect x="943" y="463" width="74" height="6" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-opacity="0.95"/>

  <!-- === COLUMN 3 at x≈1130 (shifted left from 1160 to fit) === -->
  <rect x="1110" y="155" width="50" height="305" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- Fluting lines -->
  <line x1="1120" y1="155" x2="1120" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.5"/>
  <line x1="1128" y1="155" x2="1128" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.5"/>
  <line x1="1136" y1="155" x2="1136" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.5"/>
  <line x1="1144" y1="155" x2="1144" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.5"/>
  <line x1="1152" y1="155" x2="1152" y2="460" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.5"/>
  <!-- Ionic capital -->
  <path d="M1103,155 Q1135,145 1167,155" fill="none" stroke="url(#goldGrad1)" stroke-width="1.8" stroke-opacity="0.85"/>
  <path d="M1105,148 Q1135,138 1165,148" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Volutes -->
  <path d="M1106,151 Q1098,144 1103,136 Q1108,128 1116,132 Q1124,136 1120,143" fill="none" stroke="#C9973A" stroke-width="1.2" stroke-opacity="0.75"/>
  <path d="M1164,151 Q1172,144 1167,136 Q1162,128 1154,132 Q1146,136 1150,143" fill="none" stroke="#C9973A" stroke-width="1.2" stroke-opacity="0.75"/>
  <!-- Abacus -->
  <rect x="1098" y="130" width="74" height="10" fill="none" stroke="url(#goldGrad1)" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Column base -->
  <rect x="1103" y="455" width="64" height="8" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-opacity="0.8"/>
  <rect x="1098" y="463" width="74" height="6" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- === ENTABLATURE (horizontal beam across top of all columns) === -->
  <!-- Architrave -->
  <rect x="758" y="120" width="424" height="15" fill="none" stroke="url(#goldGradH1)" stroke-width="2" stroke-opacity="0.95"/>
  <!-- Frieze -->
  <rect x="755" y="105" width="430" height="16" fill="none" stroke="url(#goldGradH1)" stroke-width="1.5" stroke-opacity="0.9"/>
  <!-- Decorative frieze detail -->
  <line x1="780" y1="105" x2="780" y2="121" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="820" y1="105" x2="820" y2="121" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="860" y1="105" x2="860" y2="121" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="900" y1="105" x2="900" y2="121" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="940" y1="105" x2="940" y2="121" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="980" y1="105" x2="980" y2="121" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="1020" y1="105" x2="1020" y2="121" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="1060" y1="105" x2="1060" y2="121" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="1100" y1="105" x2="1100" y2="121" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="1140" y1="105" x2="1140" y2="121" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- === TRIANGULAR PEDIMENT === -->
  <polygon points="970,38 758,105 1182,105" fill="none" stroke="url(#goldGradH1)" stroke-width="2" stroke-opacity="0.95"/>
  <!-- Inner pediment line (parallel) -->
  <polygon points="970,55 775,99 1165,99" fill="none" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- Pediment acroteria (decorative tips) -->
  <circle cx="970" cy="38" r="5" fill="none" stroke="#F2D878" stroke-width="1.5" stroke-opacity="0.9"/>
  <circle cx="758" cy="105" r="4" fill="none" stroke="#F2D878" stroke-width="1.2" stroke-opacity="0.8"/>
  <circle cx="1182" cy="105" r="4" fill="none" stroke="#F2D878" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- === 3-STEP PLATFORM AT BOTTOM === -->
  <!-- Step 1 (top/narrowest) -->
  <rect x="753" y="469" width="484" height="12" fill="none" stroke="url(#goldGradH1)" stroke-width="1.8" stroke-opacity="0.95"/>
  <!-- Step 2 -->
  <rect x="738" y="481" width="514" height="13" fill="none" stroke="url(#goldGradH1)" stroke-width="1.8" stroke-opacity="0.9"/>
  <!-- Step 3 (bottom/widest) -->
  <rect x="723" y="494" width="544" height="14" fill="none" stroke="url(#goldGradH1)" stroke-width="2" stroke-opacity="0.85"/>

  <!-- Subtle glow lines behind columns -->
  <line x1="800" y1="130" x2="800" y2="510" stroke="#F2D878" stroke-width="0.4" stroke-opacity="0.15"/>
  <line x1="980" y1="130" x2="980" y2="510" stroke="#F2D878" stroke-width="0.4" stroke-opacity="0.2"/>
  <line x1="1135" y1="130" x2="1135" y2="510" stroke="#F2D878" stroke-width="0.4" stroke-opacity="0.12"/>
</svg>
