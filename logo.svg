  <!-- R — curva do ventre (bowl) -->
  <path d="M26 12 Q94 12 94 52 Q94 88 26 84"
        stroke="url(#gold)" stroke-width="12" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- R — perna diagonal -->
  <line x1="62" y1="78" x2="104" y2="110"
        stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>

  <!-- W -->
  <polyline points="16,122 42,184 66,144 90,184 114,122"
            stroke="url(#gold)" stroke-width="12" fill="none"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
