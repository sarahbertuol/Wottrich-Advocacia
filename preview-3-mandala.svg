  <!-- === DECORATIVE DIAMONDS between r=130 and r=170 at every 45° === -->
  <!-- Diamond at 0°: midpoint at (960, 150) - r=150 -->
  <polygon points="960,130 975,150 960,170 945,150" fill="none" stroke="#C9973A" stroke-width="1.2" stroke-opacity="0.75"/>
  <!-- Diamond at 45°: midpoint at (1066, 194) - r=150 -->
