<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 192" fill="none">
  <defs>
    <linearGradient id="gold" x1="20" y1="10" x2="115" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0CE70"/>
      <stop offset="0.45" stop-color="#C9973A"/>
      <stop offset="1" stop-color="#9A7018"/>
    </linearGradient>
  </defs>

  <!-- R — haste vertical -->
  <line x1="26" y1="12" x2="26" y2="110"
