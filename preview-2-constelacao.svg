  <line x1="870" y1="140" x2="1050" y2="340" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="870" y1="140" x2="750" y2="260" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="870" y1="140" x2="980" y2="200" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="870" y1="140" x2="1100" y2="180" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="870" y1="140" x2="790" y2="80" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="870" y1="140" x2="700" y2="160" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Lines from node B (1050,340) -->
  <line x1="1050" y1="340" x2="750" y2="260" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="1050" y1="340" x2="980" y2="200" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.45"/>
  <line x1="1050" y1="340" x2="1100" y2="180" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="1050" y1="340" x2="1150" y2="450" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="1050" y1="340" x2="900" y2="440" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="1050" y1="340" x2="1130" y2="290" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Lines from node C (750,260) -->
  <line x1="750" y1="260" x2="980" y2="200" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="750" y1="260" x2="700" y2="160" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="750" y1="260" x2="680" y2="380" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="750" y1="260" x2="900" y2="440" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.38"/>

