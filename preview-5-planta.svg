<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F2D878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A6012;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad5H" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F2D878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A6012;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowH" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 L1.5,3 Z" fill="#C9973A" fill-opacity="0.7"/>
    </marker>
    <marker id="arrowV" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 L1.5,3 Z" fill="#C9973A" fill-opacity="0.7"/>
    </marker>
  </defs>

  <!-- Navy background -->
  <rect width="1200" height="600" fill="#111D34"/>

  <!-- === OUTER PERIMETER: 660,70 to 1180,530, stroke-width 2 === -->
  <rect x="660" y="70" width="520" height="460" fill="none" stroke="url(#goldGrad5H)" stroke-width="2" stroke-opacity="0.9"/>

  <!-- === INTERIOR WALLS stroke-width 1.5 === -->
  <!-- Horizontal wall: (660,300) to (980,300) -->
  <line x1="660" y1="300" x2="980" y2="300" stroke="url(#goldGrad5H)" stroke-width="1.5" stroke-opacity="0.85"/>
  <!-- Vertical wall: (980,70) to (980,530) -->
  <line x1="980" y1="70" x2="980" y2="530" stroke="url(#goldGrad5)" stroke-width="1.5" stroke-opacity="0.85"/>
  <!-- Short wall: (820,300) to (820,530) -->
  <line x1="820" y1="300" x2="820" y2="530" stroke="url(#goldGrad5)" stroke-width="1.5" stroke-opacity="0.82"/>
  <!-- Short wall: (980,200) to (1180,200) -->
  <line x1="980" y1="200" x2="1180" y2="200" stroke="url(#goldGrad5H)" stroke-width="1.5" stroke-opacity="0.82"/>

  <!-- === DOOR ARCS (quarter circles r=40) === -->
  <!-- Door at (820,300): arc sweeping into bottom-left room (down-right quarter) -->
  <!-- Arc from (820,300) sweeping 90° eastward: center at (820,340), arc from (820,300) to (860,340) -->
  <path d="M820,300 A40,40 0 0,1 860,340" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.75"/>
  <!-- Door gap indicator -->
  <line x1="820" y1="300" x2="860" y2="300" stroke="#111D34" stroke-width="3"/>
  <line x1="820" y1="300" x2="860" y2="300" stroke="#C9973A" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,3"/>

  <!-- Door at (980,300): arc sweeping into bottom-right area (down-left quarter) -->
  <!-- Arc from (980,300) sweeping westward: center at (980,340), from (980,300) to (940,340) -->
  <path d="M980,300 A40,40 0 0,0 940,340" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.75"/>
  <!-- Door gap indicator -->
  <line x1="940" y1="300" x2="980" y2="300" stroke="#111D34" stroke-width="3"/>
  <line x1="940" y1="300" x2="980" y2="300" stroke="#C9973A" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,3"/>

  <!-- Door at (660,300): wall opening with arc sweeping inward (rightward) -->
  <!-- Treat as opening in left wall with arc: center (700,300), from (660,300) to (700,260) -->
  <path d="M660,300 A40,40 0 0,1 700,260" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.7"/>
  <!-- Door gap -->
  <line x1="660" y1="260" x2="660" y2="300" stroke="#111D34" stroke-width="3"/>
  <line x1="660" y1="260" x2="660" y2="300" stroke="#C9973A" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,3"/>

  <!-- === WINDOW INDICATORS (3 parallel short lines perpendicular to wall) === -->
  <!-- On top wall at x=800: three lines y=70 to y=80 -->
  <line x1="792" y1="70" x2="792" y2="82" stroke="#C9973A" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="800" y1="70" x2="800" y2="82" stroke="#C9973A" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="808" y1="70" x2="808" y2="82" stroke="#C9973A" stroke-width="1" stroke-opacity="0.8"/>
  <!-- Horizontal window sill line -->
  <line x1="788" y1="76" x2="812" y2="76" stroke="#C9973A" stroke-width="0.7" stroke-opacity="0.6"/>

  <!-- On right wall at y=150: three lines x=1170 to x=1180 -->
  <line x1="1168" y1="143" x2="1182" y2="143" stroke="#C9973A" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="1168" y1="150" x2="1182" y2="150" stroke="#C9973A" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="1168" y1="157" x2="1182" y2="157" stroke="#C9973A" stroke-width="1" stroke-opacity="0.8"/>
  <!-- Vertical window sill line -->
  <line x1="1174" y1="139" x2="1174" y2="161" stroke="#C9973A" stroke-width="0.7" stroke-opacity="0.6"/>

  <!-- On right wall at y=380: three lines -->
  <line x1="1168" y1="373" x2="1182" y2="373" stroke="#C9973A" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="1168" y1="380" x2="1182" y2="380" stroke="#C9973A" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="1168" y1="387" x2="1182" y2="387" stroke="#C9973A" stroke-width="1" stroke-opacity="0.8"/>
  <line x1="1174" y1="369" x2="1174" y2="391" stroke="#C9973A" stroke-width="0.7" stroke-opacity="0.6"/>

  <!-- === DIMENSION LINES (stroke-width 0.5) === -->
  <!-- Horizontal: y=555, x=660 to x=1180, ticks at both ends -->
  <line x1="660" y1="555" x2="1180" y2="555" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.65"/>
  <!-- Left tick -->
  <line x1="660" y1="549" x2="660" y2="561" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.65"/>
  <!-- Right tick -->
  <line x1="1180" y1="549" x2="1180" y2="561" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.65"/>
  <!-- Arrowhead left -->
  <polygon points="665,555 672,551 672,559" fill="#C9973A" fill-opacity="0.65"/>
  <!-- Arrowhead right -->
  <polygon points="1175,555 1168,551 1168,559" fill="#C9973A" fill-opacity="0.65"/>
  <!-- Leader lines from perimeter to dimension -->
  <line x1="660" y1="530" x2="660" y2="560" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.4" stroke-dasharray="2,3"/>
  <line x1="1180" y1="530" x2="1180" y2="560" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.4" stroke-dasharray="2,3"/>

  <!-- Vertical dimension: x=640, y=70 to y=530 -->
  <line x1="640" y1="70" x2="640" y2="530" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.65"/>
  <!-- Top tick -->
  <line x1="634" y1="70" x2="646" y2="70" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.65"/>
  <!-- Bottom tick -->
  <line x1="634" y1="530" x2="646" y2="530" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.65"/>
  <!-- Arrowhead top -->
  <polygon points="640,75 636,82 644,82" fill="#C9973A" fill-opacity="0.65"/>
  <!-- Arrowhead bottom -->
  <polygon points="640,525 636,518 644,518" fill="#C9973A" fill-opacity="0.65"/>
  <!-- Leader lines -->
  <line x1="660" y1="70" x2="635" y2="70" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.4" stroke-dasharray="2,3"/>
  <line x1="660" y1="530" x2="635" y2="530" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.4" stroke-dasharray="2,3"/>

  <!-- === CORNER MARKS (small L-shapes) at 4 perimeter corners === -->
  <!-- Top-left (660,70) -->
  <polyline points="660,90 660,70 680,70" fill="none" stroke="#F2D878" stroke-width="1.2" stroke-opacity="0.8"/>
  <!-- Top-right (1180,70) -->
  <polyline points="1160,70 1180,70 1180,90" fill="none" stroke="#F2D878" stroke-width="1.2" stroke-opacity="0.8"/>
  <!-- Bottom-left (660,530) -->
  <polyline points="660,510 660,530 680,530" fill="none" stroke="#F2D878" stroke-width="1.2" stroke-opacity="0.8"/>
  <!-- Bottom-right (1180,530) -->
  <polyline points="1160,530 1180,530 1180,510" fill="none" stroke="#F2D878" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- === CROSS/PLUS MARKS AT WALL INTERSECTIONS === -->
  <!-- Intersection: (980,300) -->
  <line x1="974" y1="300" x2="986" y2="300" stroke="#F2D878" stroke-width="1" stroke-opacity="0.75"/>
  <line x1="980" y1="294" x2="980" y2="306" stroke="#F2D878" stroke-width="1" stroke-opacity="0.75"/>
  <!-- Intersection: (820,300) -->
  <line x1="814" y1="300" x2="826" y2="300" stroke="#F2D878" stroke-width="1" stroke-opacity="0.75"/>
  <line x1="820" y1="294" x2="820" y2="306" stroke="#F2D878" stroke-width="1" stroke-opacity="0.75"/>
  <!-- Intersection: (980,200) with right wall -->
  <line x1="974" y1="200" x2="986" y2="200" stroke="#F2D878" stroke-width="1" stroke-opacity="0.75"/>
  <line x1="980" y1="194" x2="980" y2="206" stroke="#F2D878" stroke-width="1" stroke-opacity="0.75"/>
  <!-- Intersection: (980,70) - top of vertical wall with perimeter -->
  <line x1="974" y1="70" x2="986" y2="70" stroke="#F2D878" stroke-width="1" stroke-opacity="0.65"/>
  <line x1="980" y1="64" x2="980" y2="76" stroke="#F2D878" stroke-width="1" stroke-opacity="0.65"/>
  <!-- Intersection: (980,530) - bottom of vertical wall with perimeter -->
  <line x1="974" y1="530" x2="986" y2="530" stroke="#F2D878" stroke-width="1" stroke-opacity="0.65"/>
  <line x1="980" y1="524" x2="980" y2="536" stroke="#F2D878" stroke-width="1" stroke-opacity="0.65"/>
  <!-- Intersection: (820,530) - short wall meets perimeter -->
  <line x1="814" y1="530" x2="826" y2="530" stroke="#F2D878" stroke-width="1" stroke-opacity="0.65"/>
  <line x1="820" y1="524" x2="820" y2="536" stroke="#F2D878" stroke-width="1" stroke-opacity="0.65"/>
  <!-- Intersection: (660,300) - left wall opening -->
  <line x1="654" y1="300" x2="666" y2="300" stroke="#F2D878" stroke-width="1" stroke-opacity="0.65"/>
  <line x1="660" y1="294" x2="660" y2="306" stroke="#F2D878" stroke-width="1" stroke-opacity="0.65"/>
  <!-- Intersection: (1180,200) - right wall with horizontal -->
  <line x1="1174" y1="200" x2="1186" y2="200" stroke="#F2D878" stroke-width="1" stroke-opacity="0.65"/>
  <line x1="1180" y1="194" x2="1180" y2="206" stroke="#F2D878" stroke-width="1" stroke-opacity="0.65"/>

  <!-- === NORTH ARROW at (720, 120) === -->
  <!-- Arrow shaft pointing up -->
  <line x1="720" y1="140" x2="720" y2="104" stroke="#C9973A" stroke-width="1.2" stroke-opacity="0.85"/>
  <!-- Arrowhead pointing up -->
  <polygon points="720,95 714,110 726,110" fill="none" stroke="#C9973A" stroke-width="1.2" stroke-opacity="0.85"/>
  <!-- N label -->
  <text x="715" y="152" font-family="serif" font-size="11" fill="none" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.85">N</text>
  <!-- Small circle at base of arrow -->
  <circle cx="720" cy="142" r="3" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.75"/>

  <!-- === SCALE BAR at (1050, 555), 80px long === -->
  <!-- Top line -->
  <line x1="1050" y1="552" x2="1130" y2="552" stroke="#C9973A" stroke-width="1" stroke-opacity="0.7"/>
  <!-- Bottom line -->
  <line x1="1050" y1="558" x2="1130" y2="558" stroke="#C9973A" stroke-width="1" stroke-opacity="0.7"/>
  <!-- Left tick -->
  <line x1="1050" y1="549" x2="1050" y2="561" stroke="#C9973A" stroke-width="1" stroke-opacity="0.7"/>
  <!-- Mid tick -->
  <line x1="1090" y1="549" x2="1090" y2="561" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.6"/>
  <!-- Right tick -->
  <line x1="1130" y1="549" x2="1130" y2="561" stroke="#C9973A" stroke-width="1" stroke-opacity="0.7"/>
  <!-- Fill alternating halves with thin line to suggest scale -->
  <line x1="1050" y1="555" x2="1090" y2="555" stroke="#C9973A" stroke-width="3" stroke-opacity="0.35"/>

  <!-- === ROOM LABELS (very thin text, blueprint style) === -->
  <!-- Top-left room -->
  <text x="710" y="195" font-family="serif" font-size="9" fill="none" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.55" text-anchor="middle">SALA</text>
  <!-- Top-right room -->
  <text x="1080" y="145" font-family="serif" font-size="9" fill="none" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.55" text-anchor="middle">ESCRITÓRIO</text>
  <!-- Bottom-left room (divided) -->
  <text x="735" y="420" font-family="serif" font-size="9" fill="none" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.55" text-anchor="middle">ARQUIVO</text>
  <!-- Bottom-center room -->
  <text x="900" y="420" font-family="serif" font-size="9" fill="none" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.55" text-anchor="middle">REUNIÃO</text>
  <!-- Bottom-right room -->
  <text x="1080" y="370" font-family="serif" font-size="9" fill="none" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.55" text-anchor="middle">SUÍTE</text>

  <!-- === SUBTLE HATCHING on walls (blueprint convention) === -->
  <!-- Thin diagonal hatching hint on perimeter walls (top) -->
  <line x1="670" y1="70" x2="680" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="700" y1="70" x2="710" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="730" y1="70" x2="740" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="760" y1="70" x2="770" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="830" y1="70" x2="840" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="860" y1="70" x2="870" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="900" y1="70" x2="910" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="930" y1="70" x2="940" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="960" y1="70" x2="970" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="1000" y1="70" x2="1010" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="1030" y1="70" x2="1040" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="1060" y1="70" x2="1070" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="1090" y1="70" x2="1100" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="1120" y1="70" x2="1130" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
  <line x1="1150" y1="70" x2="1160" y2="80" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.3"/>
</svg>
