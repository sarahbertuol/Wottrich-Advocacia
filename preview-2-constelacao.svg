  <!-- Node H: (1150, 450) r=4 -->
  <circle cx="1150" cy="450" r="4" fill="none" stroke="#C9973A" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Node I: (680, 380) r=3 -->
  <circle cx="680" cy="380" r="3" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.38"/>
  <!-- Node J: (700, 160) r=3 -->
  <circle cx="700" cy="160" r="3" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.35"/>
  <!-- Node K: (790, 80) r=3 -->
  <circle cx="790" cy="80" r="3" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Additional tiny ambient nodes for richness -->
  <circle cx="1030" cy="490" r="2.5" fill="none" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.3"/>
  <circle cx="820" cy="350" r="3.5" fill="none" stroke="#C9973A" stroke-width="1" stroke-opacity="0.45"/>
  <circle cx="1080" cy="420" r="3" fill="none" stroke="#C9973A" stroke-width="0.9" stroke-opacity="0.38"/>

  <!-- Extra thin connecting lines to ambient nodes -->
  <line x1="1050" y1="340" x2="1030" y2="490" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="750" y1="260" x2="820" y2="350" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.3"/>
  <line x1="820" y1="350" x2="900" y2="440" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.28"/>
  <line x1="1050" y1="340" x2="1080" y2="420" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.27"/>
  <line x1="1150" y1="450" x2="1080" y2="420" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- Subtle radiant glow suggestion around main nodes -->
  <circle cx="870" cy="140" r="40" fill="none" stroke="#F2D878" stroke-width="0.3" stroke-opacity="0.08"/>
  <circle cx="1050" cy="340" r="38" fill="none" stroke="#F2D878" stroke-width="0.3" stroke-opacity="0.08"/>
</svg>
