  <!-- NE (45°)  1130,130 --> <circle cx="1130" cy="130" r="4" fill="none" stroke="#F2D878" stroke-width="1.5" stroke-opacity="0.85"/>
  <!-- E  (90°)  1200,300 --> <circle cx="1200" cy="300" r="4" fill="none" stroke="#F2D878" stroke-width="1.5" stroke-opacity="0.85"/>
  <!-- SE (135°) 1130,470 --> <circle cx="1130" cy="470" r="4" fill="none" stroke="#F2D878" stroke-width="1.5" stroke-opacity="0.85"/>
  <!-- S  (180°) 960,540  --> <circle cx="960" cy="540" r="4" fill="none" stroke="#F2D878" stroke-width="1.5" stroke-opacity="0.85"/>
