<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 248" fill="none">
  <defs>
    <linearGradient id="g" x1="18" y1="18" x2="165" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2D878"/>
      <stop offset="0.38" stop-color="#D4A840"/>
      <stop offset="0.72" stop-color="#C9973A"/>
      <stop offset="1" stop-color="#8A6012"/>
    </linearGradient>
  </defs>

  <!-- R — haste esquerda (pilar esquerdo do escudo) -->
  <line x1="30" y1="18" x2="30" y2="204"
        stroke="url(#g)" stroke-width="20" stroke-linecap="butt"/>

  <!-- R — ventre (arco da direita, conecta topo do pilar) -->
  <path d="M30 18 Q132 18 132 72 Q132 128 30 128"
        stroke="url(#g)" stroke-width="13" fill="none"
        stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- R — perna diagonal (vai ao ponto de junção com o W) -->
  <line x1="92" y1="120" x2="144" y2="204"
        stroke="url(#g)" stroke-width="12" stroke-linecap="round"/>

  <!-- W — traço externo esquerdo (parte de baixo do pilar esquerdo) -->
  <line x1="28" y1="204" x2="16" y2="240"
        stroke="url(#g)" stroke-width="12" stroke-linecap="round"/>

  <!-- W — V esquerdo (sobe da base ao pico central esq.) -->
  <line x1="16" y1="240" x2="62" y2="196"
        stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>

  <!-- W — V central (desce do pico ao vale central) -->
  <line x1="62" y1="196" x2="108" y2="240"
        stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>

  <!-- W — traço externo direito (sobe do vale ao ponto de junção da perna do R) -->
  <line x1="108" y1="240" x2="144" y2="204"
        stroke="url(#g)" stroke-width="12" stroke-linecap="round"/>

  <!-- Pilar direito do escudo: parte do ponto de junção e sobe até o topo -->
  <line x1="144" y1="204" x2="153" y2="18"
        stroke="url(#g)" stroke-width="14" stroke-linecap="round"/>
</svg>
