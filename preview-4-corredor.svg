<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F2D878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A6012;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad4H" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F2D878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A6012;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Navy background -->
  <rect width="1200" height="600" fill="#111D34"/>

  <!-- === PORTAL 1 (outermost) ===
       Rect: (690,140)-(1170,140)-(1170,520)-(690,520)
       Arch peak at (930,55) -->
  <!-- Left vertical side -->
  <line x1="690" y1="140" x2="690" y2="520" stroke="url(#goldGrad4)" stroke-width="2.5" stroke-opacity="0.75"/>
  <!-- Right vertical side -->
  <line x1="1170" y1="140" x2="1170" y2="520" stroke="url(#goldGrad4)" stroke-width="2.5" stroke-opacity="0.75"/>
  <!-- Bottom horizontal -->
  <line x1="690" y1="520" x2="1170" y2="520" stroke="#C9973A" stroke-width="2.5" stroke-opacity="0.75"/>
  <!-- Arch: from (690,140) up to peak (930,55) down to (1170,140) -->
  <path d="M690,140 Q930,55 1170,140" fill="none" stroke="url(#goldGrad4H)" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Arch inner detail line -->
  <path d="M705,138 Q930,68 1155,138" fill="none" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- === PORTAL 2 ===
       Rect: (770,185)-(1090,185)-(1090,475)-(770,475)
       Arch peak at (930,105) -->
  <line x1="770" y1="185" x2="770" y2="475" stroke="url(#goldGrad4)" stroke-width="2" stroke-opacity="0.82"/>
  <line x1="1090" y1="185" x2="1090" y2="475" stroke="url(#goldGrad4)" stroke-width="2" stroke-opacity="0.82"/>
  <line x1="770" y1="475" x2="1090" y2="475" stroke="#C9973A" stroke-width="2" stroke-opacity="0.82"/>
  <path d="M770,185 Q930,105 1090,185" fill="none" stroke="url(#goldGrad4H)" stroke-width="2" stroke-opacity="0.85"/>
  <path d="M782,183 Q930,117 1078,183" fill="none" stroke="#C9973A" stroke-width="0.7" stroke-opacity="0.42"/>

  <!-- === PORTAL 3 ===
       Rect: (830,215)-(1030,215)-(1030,445)-(830,445)
       Arch peak at (930,145) -->
  <line x1="830" y1="215" x2="830" y2="445" stroke="url(#goldGrad4)" stroke-width="1.8" stroke-opacity="0.88"/>
  <line x1="1030" y1="215" x2="1030" y2="445" stroke="url(#goldGrad4)" stroke-width="1.8" stroke-opacity="0.88"/>
  <line x1="830" y1="445" x2="1030" y2="445" stroke="#C9973A" stroke-width="1.8" stroke-opacity="0.88"/>
  <path d="M830,215 Q930,145 1030,215" fill="none" stroke="url(#goldGrad4H)" stroke-width="1.8" stroke-opacity="0.9"/>
  <path d="M840,213 Q930,155 1020,213" fill="none" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.45"/>

  <!-- === PORTAL 4 ===
       Rect: (875,240)-(985,240)-(985,420)-(875,420)
       Arch peak at (930,175) -->
  <line x1="875" y1="240" x2="875" y2="420" stroke="url(#goldGrad4)" stroke-width="1.5" stroke-opacity="0.92"/>
  <line x1="985" y1="240" x2="985" y2="420" stroke="url(#goldGrad4)" stroke-width="1.5" stroke-opacity="0.92"/>
  <line x1="875" y1="420" x2="985" y2="420" stroke="#C9973A" stroke-width="1.5" stroke-opacity="0.92"/>
  <path d="M875,240 Q930,175 985,240" fill="none" stroke="url(#goldGrad4H)" stroke-width="1.5" stroke-opacity="0.95"/>
  <path d="M882,239 Q930,182 978,239" fill="none" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.48"/>

  <!-- === PORTAL 5 (innermost) ===
       Rect: (905,260)-(955,260)-(955,400)-(905,400)
       Arch peak at (930,205) -->
  <line x1="905" y1="260" x2="905" y2="400" stroke="url(#goldGrad4)" stroke-width="1.2" stroke-opacity="0.95"/>
  <line x1="955" y1="260" x2="955" y2="400" stroke="url(#goldGrad4)" stroke-width="1.2" stroke-opacity="0.95"/>
  <line x1="905" y1="400" x2="955" y2="400" stroke="#C9973A" stroke-width="1.2" stroke-opacity="0.95"/>
  <path d="M905,260 Q930,205 955,260" fill="none" stroke="url(#goldGrad4H)" stroke-width="1.2" stroke-opacity="1"/>
  <!-- Tiny innermost vanishing hint -->
  <path d="M916,260 Q930,214 944,260" fill="none" stroke="#F2D878" stroke-width="0.4" stroke-opacity="0.5"/>

  <!-- === PERSPECTIVE LINES connecting corners of consecutive portals === -->
  <!-- Upper-left corners: P1(690,140) -> P2(770,185) -> P3(830,215) -> P4(875,240) -> P5(905,260) -->
  <line x1="690" y1="140" x2="905" y2="260" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- Upper-right corners: P1(1170,140) -> P2(1090,185) -> P3(1030,215) -> P4(985,240) -> P5(955,260) -->
  <line x1="1170" y1="140" x2="955" y2="260" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- Lower-left corners: P1(690,520) -> P2(770,475) -> P3(830,445) -> P4(875,420) -> P5(905,400) -->
  <line x1="690" y1="520" x2="905" y2="400" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- Lower-right corners: P1(1170,520) -> P2(1090,475) -> P3(1030,445) -> P4(985,420) -> P5(955,400) -->
  <line x1="1170" y1="520" x2="955" y2="400" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Arch apex convergence lines -->
  <!-- Arch peaks: P1(930,55) -> P2(930,105) -> P3(930,145) -> P4(930,175) -> P5(930,205) all on x=930 -->
  <line x1="930" y1="55" x2="930" y2="260" stroke="#F2D878" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- === FLOOR GRID LINES converging to VP (930, 300) === -->
  <!-- Horizontal grid lines on floor (below center) -->
  <line x1="690" y1="520" x2="1170" y2="520" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="730" y1="500" x2="1130" y2="500" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.2"/>
  <line x1="760" y1="480" x2="1100" y2="480" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.18"/>
  <line x1="790" y1="460" x2="1070" y2="460" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.16"/>
  <line x1="810" y1="445" x2="1050" y2="445" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.15"/>
  <line x1="840" y1="430" x2="1020" y2="430" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.14"/>

  <!-- Floor converging lines to VP -->
  <line x1="690" y1="520" x2="930" y2="300" stroke="#C9973A" stroke-width="0.4" stroke-opacity="0.2"/>
  <line x1="730" y1="520" x2="930" y2="300" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.15"/>
  <line x1="780" y1="520" x2="930" y2="300" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.15"/>
  <line x1="840" y1="520" x2="930" y2="300" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.15"/>
  <line x1="930" y1="520" x2="930" y2="300" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.15"/>
  <line x1="1020" y1="520" x2="930" y2="300" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.15"/>
  <line x1="1080" y1="520" x2="930" y2="300" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.15"/>
  <line x1="1130" y1="520" x2="930" y2="300" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.15"/>
  <line x1="1170" y1="520" x2="930" y2="300" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.2"/>

  <!-- Ceiling converging lines to VP -->
  <line x1="690" y1="140" x2="930" y2="300" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.15"/>
  <line x1="1170" y1="140" x2="930" y2="300" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.15"/>

  <!-- Subtle glow at vanishing point -->
  <circle cx="930" cy="300" r="8" fill="none" stroke="#F2D878" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="930" cy="300" r="18" fill="none" stroke="#F2D878" stroke-width="0.5" stroke-opacity="0.25"/>
  <circle cx="930" cy="300" r="35" fill="none" stroke="#C9973A" stroke-width="0.3" stroke-opacity="0.15"/>
</svg>
