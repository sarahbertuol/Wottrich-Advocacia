  <!-- 15° --> <line x1="960" y1="300" x2="1022" y2="62" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.4"/>
  <!-- 30° --> <line x1="960" y1="300" x2="1080" y2="92" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.4"/>
  <!-- 45° --> <line x1="960" y1="300" x2="1130" y2="130" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.4"/>
  <!-- 60° --> <line x1="960" y1="300" x2="1168" y2="180" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.4"/>
  <!-- 75° --> <line x1="960" y1="300" x2="1198" y2="238" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.4"/>
