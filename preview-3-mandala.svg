  <!-- 120° --> <line x1="960" y1="300" x2="1168" y2="420" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.4"/>
  <!-- 135° --> <line x1="960" y1="300" x2="1130" y2="470" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.4"/>
  <!-- 150° --> <line x1="960" y1="300" x2="1080" y2="508" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.4"/>
  <!-- 165° --> <line x1="960" y1="300" x2="1022" y2="538" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.4"/>
  <!-- 180° --> <line x1="960" y1="300" x2="960" y2="540" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.4"/>
  <!-- 195° --> <line x1="960" y1="300" x2="898" y2="538" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.4"/>
  <!-- 210° --> <line x1="960" y1="300" x2="840" y2="508" stroke="#C9973A" stroke-width="0.6" stroke-opacity="0.4"/>
