    <!-- 235°--> <line x1="960" y1="240" x2="960" y2="252" transform="rotate(235 960 300)"/>
    <!-- 245°--> <line x1="960" y1="240" x2="960" y2="252" transform="rotate(245 960 300)"/>
    <!-- 250°--> <line x1="960" y1="240" x2="960" y2="252" transform="rotate(250 960 300)"/>
    <!-- 260°--> <line x1="960" y1="240" x2="960" y2="252" transform="rotate(260 960 300)"/>
    <!-- 265°--> <line x1="960" y1="240" x2="960" y2="252" transform="rotate(265 960 300)"/>
    <!-- 275°--> <line x1="960" y1="240" x2="960" y2="252" transform="rotate(275 960 300)"/>
