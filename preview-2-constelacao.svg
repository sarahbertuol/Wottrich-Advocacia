  <line x1="980" y1="200" x2="1100" y2="180" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.42"/>
  <line x1="980" y1="200" x2="1130" y2="290" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="1100" y1="180" x2="1130" y2="290" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.38"/>
  <line x1="900" y1="440" x2="1150" y2="450" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="900" y1="440" x2="680" y2="380" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.32"/>
  <line x1="680" y1="380" x2="700" y2="160" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.28"/>
  <line x1="1150" y1="450" x2="1130" y2="290" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.33"/>
  <line x1="790" y1="80" x2="700" y2="160" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.3"/>
  <line x1="790" y1="80" x2="980" y2="200" stroke="#C9973A" stroke-width="0.8" stroke-opacity="0.28"/>

  <!-- === LARGE NODE A: (870, 140) r=10 === -->
  <!-- Halo rings -->
  <circle cx="870" cy="140" r="18" fill="none" stroke="#C9973A" stroke-width="0.7" stroke-opacity="0.3"/>
  <circle cx="870" cy="140" r="26" fill="none" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.18"/>
  <!-- Main node -->
  <circle cx="870" cy="140" r="10" fill="none" stroke="url(#goldGrad2)" stroke-width="2" stroke-opacity="0.95"/>
  <circle cx="870" cy="140" r="4" fill="none" stroke="#F2D878" stroke-width="1" stroke-opacity="0.8"/>

  <!-- === LARGE NODE B: (1050, 340) r=9 === -->
  <!-- Halo rings -->
  <circle cx="1050" cy="340" r="17" fill="none" stroke="#C9973A" stroke-width="0.7" stroke-opacity="0.32"/>
  <circle cx="1050" cy="340" r="25" fill="none" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.18"/>
  <!-- Main node -->
  <circle cx="1050" cy="340" r="9" fill="none" stroke="url(#goldGrad2)" stroke-width="2" stroke-opacity="1"/>
  <circle cx="1050" cy="340" r="3.5" fill="none" stroke="#F2D878" stroke-width="1" stroke-opacity="0.8"/>

  <!-- === LARGE NODE C: (750, 260) r=8 === -->
  <!-- Halo rings -->
  <circle cx="750" cy="260" r="16" fill="none" stroke="#C9973A" stroke-width="0.7" stroke-opacity="0.28"/>
  <circle cx="750" cy="260" r="24" fill="none" stroke="#C9973A" stroke-width="0.5" stroke-opacity="0.15"/>
  <!-- Main node -->
  <circle cx="750" cy="260" r="8" fill="none" stroke="url(#goldGrad2)" stroke-width="1.8" stroke-opacity="0.9"/>
  <circle cx="750" cy="260" r="3" fill="none" stroke="#F2D878" stroke-width="1" stroke-opacity="0.75"/>

  <!-- === MEDIUM NODES === -->
  <!-- Node D: (980, 200) r=6 -->
  <circle cx="980" cy="200" r="6" fill="none" stroke="#C9973A" stroke-width="1.5" stroke-opacity="0.8"/>
  <!-- Node E: (1100, 180) r=5 -->
  <circle cx="1100" cy="180" r="5" fill="none" stroke="#C9973A" stroke-width="1.5" stroke-opacity="0.75"/>
  <!-- Node F: (1130, 290) r=6 -->
  <circle cx="1130" cy="290" r="6" fill="none" stroke="#C9973A" stroke-width="1.5" stroke-opacity="0.78"/>
  <!-- Node G: (900, 440) r=5 -->
  <circle cx="900" cy="440" r="5" fill="none" stroke="#C9973A" stroke-width="1.5" stroke-opacity="0.7"/>

